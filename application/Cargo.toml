[package]
name = "application"
version = "0.1.0"
edition = "2021"

[dependencies]
domain = { path = "../domain" }
infrastructure = { path = "../infrastructure", default-features = false, features = ["postgresql"] }
shared = { path = "../shared" }
serde_json = "1.0.88"
rocket = { version = "0.5.0-rc.2", features = ["json"] }
r2d2 = "0.8"
diesel = { version = "2.0.0" }

[dev-dependencies]
infrastructure = { path = "../infrastructure", default-features = false, features = ["sqlite"] }
uuid = {version = "*", features = ["v4"]}
